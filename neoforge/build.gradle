plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

sourceSets {
    main {
        resources {
            srcDirs += [
                    project(":common").file("src/main/generated"),
                    project(":common").file("src/main/resources")
            ]
        }
    }
    client {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    implementation "com.geckolib:geckolib-neoforge-${rootProject.minecraft_version}:${geckolib_version}"

    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
    runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"

    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    runtimeOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"

    implementation "com.github.starcatcher21.starlib:starlib-neoforge:${starlib_version}"

    implementation "dev.architectury:architectury-neoforge:${architectury_api_version}"

    // 1. Standard project reference for local compilation & dev environment
    common(project(path: ':common')) { transitive = false }

    // 2. Production transformation for bundling common into the final NeoForge JAR
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

// 3. Configure shadow task to bundle common classes
shadowJar {
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

// 4. Swap classifiers so the final output built by gradle is the shadowed JAR
tasks.named("jar", Jar) {
    archiveClassifier = "dev"
}

tasks.named("shadowJar", com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveClassifier = ""
}

assemble.dependsOn shadowJar